<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Curso — NOVO SIGA</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header class="navbar">
      <div class="brand"><a href="/novosiga">NOVO SIGA</a></div>
      <nav>
        <a href="/novosiga">Início</a>
        <a href="/alunos/listar">Alunos</a>
        <a href="/cursos/listar">Cursos</a>
        <a href="/disciplinas/listar">Disciplinas</a>
        <a href="/professores/listar">Professores</a>
      </nav>
    </header>

    <main class="container">
      <div class="page-header">
        <div>
          <h1>Cadastro de Curso</h1>
          <p>Preencha os dados do curso.</p>
        </div>
        <a class="btn btn-ghost" href="/cursos/listar">← Voltar</a>
      </div>

      <div class="form-card">
        <form th:action="@{/cursos/salvar}" method="post" th:object="${curso}">
          <input type="hidden" name="idCurso" th:field="*{idCurso}" />

          <div class="form-grid">
            <div class="form-group full">
              <label for="nomeCurso">Nome do Curso</label>
              <input
                type="text"
                id="nomeCurso"
                th:field="*{nomeCurso}"
                maxlength="20"
                required
              />
            </div>
            <div class="form-group full">
              <label for="descricaoCurso">Descrição</label>
              <textarea
                id="descricaoCurso"
                th:field="*{descricaoCurso}"
                maxlength="80"
                rows="3"
                required
              ></textarea>
            </div>
            <div class="form-group">
              <label for="cargaHorariaCurso">Carga Horária</label>
              <input
                type="text"
                id="cargaHorariaCurso"
                th:field="*{cargaHorariaCurso}"
                maxlength="10"
                required
              />
            </div>
          </div>

          <div class="form-footer">
            <a class="btn btn-ghost" href="/cursos/listar">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar curso</button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
