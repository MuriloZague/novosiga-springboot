<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alunos — NOVO SIGA</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header class="navbar">
      <div class="brand"><a href="/novosiga">NOVO SIGA</a></div>
      <nav>
        <a href="/novosiga">Início</a>
        <a href="/alunos/listar">Alunos</a>
        <a href="/cursos/listar">Cursos</a>
        <a href="/disciplinas/listar">Disciplinas</a>
        <a href="/professores/listar">Professores</a>
      </nav>
    </header>

    <main class="container">
      <div class="page-header">
        <div>
          <h1>Alunos</h1>
          <p>Lista de estudantes cadastrados no sistema.</p>
        </div>
        <a class="btn btn-primary" href="/alunos/criar">+ Novo Aluno</a>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Foto</th>
              <th>Nome</th>
              <th>Endereço</th>
              <th>Bairro</th>
              <th>Cidade</th>
              <th>UF</th>
              <th>CEP</th>
              <th>Telefone</th>
              <th>CPF</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="aluno : ${alunos}">
              <td>
                <img
                  class="avatar"
                  th:if="${aluno.fotoAluno != null}"
                  th:src="@{/alunos/foto/{id}(id=${aluno.idAluno})}"
                  alt="Foto"
                />
                <span
                  class="avatar-placeholder"
                  th:if="${aluno.fotoAluno == null}"
                  th:text="${#strings.substring(aluno.nomeAluno,0,1)}"
                ></span>
              </td>
              <td th:text="${aluno.nomeAluno}"></td>
              <td th:text="${aluno.enderecoAluno}"></td>
              <td th:text="${aluno.bairroAluno}"></td>
              <td th:text="${aluno.cidadeAluno}"></td>
              <td th:text="${aluno.estadoAluno}"></td>
              <td th:text="${aluno.cepAluno}"></td>
              <td th:text="${aluno.telefoneAluno}"></td>
              <td th:text="${aluno.cpfAluno}"></td>
              <td>
                <div class="table-actions">
                  <a
                    class="btn btn-ghost btn-sm"
                    th:href="@{/alunos/editar/{id}(id=${aluno.idAluno})}"
                    >Editar</a
                  >
                  <a
                    class="btn btn-danger btn-sm"
                    th:href="@{/alunos/excluir/{id}(id=${aluno.idAluno})}"
                    onclick="
                      return confirm('Deseja realmente excluir este aluno?');
                    "
                    >Excluir</a
                  >
                </div>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(alunos)}">
              <td colspan="10" class="empty-state">
                Nenhum aluno cadastrado ainda.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
