<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Aluno — NOVO SIGA</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header class="navbar">
      <div class="brand"><span class="logo">🎓</span> NOVO SIGA</div>
      <nav>
        <a href="/novosiga">Início</a>
        <a href="/alunos/listar">Alunos</a>
        <a href="/cursos/listar">Cursos</a>
        <a href="/disciplinas/listar">Disciplinas</a>
        <a href="/professores/listar">Professores</a>
      </nav>
    </header>

    <main class="container">
      <div class="page-header">
        <div>
          <h1>Cadastro de Aluno</h1>
          <p>Preencha os dados do estudante.</p>
        </div>
        <a class="btn btn-ghost" href="/alunos/listar">← Voltar</a>
      </div>

      <div class="form-card">
        <form
          th:action="@{/alunos/salvar}"
          method="post"
          th:object="${aluno}"
          enctype="multipart/form-data"
        >
          <input type="hidden" name="idAluno" th:field="*{idAluno}" />

          <div class="form-grid">
            <div class="form-group full">
              <label for="nomeAluno">Nome</label>
              <input type="text" id="nomeAluno" th:field="*{nomeAluno}" maxlength="50" required />
            </div>
            <div class="form-group full">
              <label for="enderecoAluno">Endereço</label>
              <input type="text" id="enderecoAluno" th:field="*{enderecoAluno}" maxlength="40" required />
            </div>
            <div class="form-group">
              <label for="bairroAluno">Bairro</label>
              <input type="text" id="bairroAluno" th:field="*{bairroAluno}" maxlength="40" required />
            </div>
            <div class="form-group">
              <label for="cidadeAluno">Cidade</label>
              <input type="text" id="cidadeAluno" th:field="*{cidadeAluno}" maxlength="30" required />
            </div>
            <div class="form-group">
              <label for="estadoAluno">Estado (UF)</label>
              <input type="text" id="estadoAluno" th:field="*{estadoAluno}" maxlength="2" required />
            </div>
            <div class="form-group">
              <label for="cepAluno">CEP</label>
              <input type="text" id="cepAluno" th:field="*{cepAluno}" maxlength="8" required />
            </div>
            <div class="form-group">
              <label for="telefoneAluno">Telefone</label>
              <input type="text" id="telefoneAluno" th:field="*{telefoneAluno}" maxlength="11" required />
            </div>
            <div class="form-group">
              <label for="cpfAluno">CPF</label>
              <input type="text" id="cpfAluno" th:field="*{cpfAluno}" maxlength="11" required />
            </div>
            <div class="form-group full">
              <label for="foto">Foto</label>
              <input type="file" id="foto" name="foto" accept="image/*" />
            </div>
          </div>

          <div class="form-footer">
            <a class="btn btn-ghost" href="/alunos/listar">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar aluno</button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
