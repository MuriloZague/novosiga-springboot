<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — NOVO SIGA</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header class="navbar">
      <div class="brand"><a href="/novosiga">NOVO SIGA</a></div>
      <nav>
        <a href="/novosiga">Início</a>
        <a href="/usuarios/criar">Cadastrar-se</a>
      </nav>
    </header>

    <main class="container">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Acesso ao sistema</h1>
          <p>Insira suas credenciais de acesso.</p>
        </div>

        <div class="alert alert-danger" th:if="${param.error}">
          Nome de usuário ou senha inválidos!
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
          Logout efetuado.
        </div>

        <form th:action="@{/login}" method="post">
          <div class="form-grid">
            <div class="form-group full">
              <label for="username">Usuário</label>
              <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
                autofocus
              />
            </div>
            <div class="form-group full">
              <label for="password">Senha</label>
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </div>
          </div>

          <div class="form-footer">
            <button type="submit" class="btn btn-primary btn-block">
              Entrar
            </button>
          </div>
        </form>

        <p class="auth-switch">
          Não tem conta? <a href="/usuarios/criar">Cadastre-se</a>
        </p>
      </div>
    </main>
  </body>
</html>
