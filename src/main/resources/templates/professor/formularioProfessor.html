<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Professor — NOVO SIGA</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header class="navbar">
      <div class="brand"><span class="logo">🎓</span> NOVO SIGA</div>
      <nav>
        <a href="/novosiga">Início</a>
        <a href="/alunos/listar">Alunos</a>
        <a href="/cursos/listar">Cursos</a>
        <a href="/disciplinas/listar">Disciplinas</a>
        <a href="/professores/listar">Professores</a>
      </nav>
    </header>

    <main class="container">
      <div class="page-header">
        <div>
          <h1>Cadastro de Professor</h1>
          <p>Preencha os dados do professor.</p>
        </div>
        <a class="btn btn-ghost" href="/professores/listar">← Voltar</a>
      </div>

      <div class="form-card">
        <form th:action="@{/professores/salvar}" method="post" th:object="${professor}">
          <input type="hidden" name="idProfessor" th:field="*{idProfessor}" />

          <div class="form-grid">
            <div class="form-group full">
              <label for="nomeProfessor">Nome</label>
              <input type="text" id="nomeProfessor" th:field="*{nomeProfessor}" maxlength="50" required />
            </div>
            <div class="form-group">
              <label for="cpfProfessor">CPF</label>
              <input type="text" id="cpfProfessor" th:field="*{cpfProfessor}" maxlength="11" required />
            </div>
            <div class="form-group">
              <label for="rgProfessor">RG</label>
              <input type="text" id="rgProfessor" th:field="*{rgProfessor}" maxlength="9" required />
            </div>
            <div class="form-group">
              <label for="telefoneProfessor">Telefone</label>
              <input type="text" id="telefoneProfessor" th:field="*{telefoneProfessor}" maxlength="11" required />
            </div>
            <div class="form-group">
              <label for="graduacaoProfessor">Graduação</label>
              <input type="text" id="graduacaoProfessor" th:field="*{graduacaoProfessor}" maxlength="20" required />
            </div>
            <div class="form-group full">
              <label for="enderecoProfessor">Endereço</label>
              <input type="text" id="enderecoProfessor" th:field="*{enderecoProfessor}" maxlength="40" required />
            </div>
          </div>

          <div class="form-footer">
            <a class="btn btn-ghost" href="/professores/listar">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar professor</button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
