<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Pedido — NOVO SIGA</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header class="navbar">
      <div class="brand"><a href="/novosiga">NOVO SIGA</a></div>
      <nav>
        <a href="/novosiga">Início</a>
        <a href="/alunos/listar">Alunos</a>
        <a href="/cursos/listar">Cursos</a>
        <a href="/disciplinas/listar">Disciplinas</a>
        <a href="/professores/listar">Professores</a>
        <a href="/produtos/listar">Produtos</a>
        <a href="/pedidos/criar">Pedidos</a>
      </nav>
    </header>

    <main class="container">
      <div class="page-header">
        <div>
          <h1>Cadastro de Pedido</h1>
          <p>Selecione o aluno e adicione produtos ao pedido.</p>
        </div>
        <a class="btn btn-ghost" href="/novosiga">← Voltar</a>
      </div>

      <datalist id="listaAlunos">
        <option
          th:each="aluno : ${alunos}"
          th:value="${aluno.idAluno + ' - ' + aluno.nomeAluno}"
        ></option>
      </datalist>

      <datalist id="listaProdutos">
        <option
          th:each="produto : ${produtos}"
          th:value="${produto.idProduto + ' - ' + produto.descricaoProduto}"
          th:attr="data-preco=${produto.valorProduto}"
        ></option>
      </datalist>

      <div class="form-card">
        <div class="form-grid">
          <div class="form-group full">
            <label for="aluno">I. Identificação do aluno</label>
            <input
              list="listaAlunos"
              id="aluno"
              type="text"
              placeholder="Digite o nome do aluno"
            />
          </div>

          <div class="form-group">
            <label for="produto">II. Produto</label>
            <input
              list="listaProdutos"
              id="produto"
              type="text"
              placeholder="Digite o nome do produto"
            />
          </div>

          <div class="form-group">
            <label for="quantidade">Quantidade</label>
            <input
              type="number"
              id="quantidade"
              min="1"
              placeholder="Selecione a quantidade"
            />
          </div>

          <div class="form-group full">
            <button type="button" class="btn btn-outline" onclick="adicionarItem()">
              Adicionar produto
            </button>
          </div>
        </div>
        <br>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Foto</th>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
                <th>Subtotal</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-itens">
              <tr id="empty-row">
                <td colspan="6" class="empty-state">
                  Nenhum produto adicionado ao pedido
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="form-footer">
          <span class="total-pedido">
            Total do Pedido: <strong>R$ <span id="totalPedido">0,00</span></strong>
          </span>
          <button type="button" class="btn btn-primary" onclick="salvarPedido()">
            Salvar pedido
          </button>
        </div>
      </div>
    </main>

    <script>
      let itens = [];

      function adicionarItem() {
        let produtoInput = document.getElementById("produto").value;
        let quantidade = document.getElementById("quantidade").value;

        if (!produtoInput || quantidade <= 0) {
          alert("Preencha corretamente o produto e a quantidade!");
          return;
        }

        let partes = produtoInput.split(" - ");
        let produtoId = partes[0];
        let produtoNome = partes[1];

        let options = document.querySelectorAll("#listaProdutos option");
        let preco = null;

        options.forEach((opt) => {
          if (opt.value === produtoInput) {
            preco = opt.getAttribute("data-preco");
          }
        });

        if (!preco) {
          alert("Produto inválido! Selecione um produto da lista.");
          return;
        }

        let subtotal = quantidade * preco;

        itens.push({
          produto: { idProduto: produtoId },
          nomeProduto: produtoNome,
          quantidade: parseInt(quantidade),
          preco: parseFloat(preco),
          subtotal: subtotal,
        });

        document.getElementById("produto").value = "";
        document.getElementById("quantidade").value = "";

        renderTabela();
      }

      function removerItem(index) {
        itens.splice(index, 1);
        renderTabela();
      }

      function alterarQuantidade(index, delta) {
        let item = itens[index];
        let novaQuantidade = item.quantidade + delta;

        if (novaQuantidade < 1) {
          return;
        }

        item.quantidade = novaQuantidade;
        item.subtotal = item.quantidade * item.preco;
        renderTabela();
      }

      function renderTabela() {
        let tabela = document.getElementById("tabela-itens");

        tabela.innerHTML = "";

        if (itens.length === 0) {
          tabela.innerHTML = `<tr id="empty-row"><td colspan="6" class="empty-state">Nenhum produto adicionado ao pedido.</td></tr>`;
          document.getElementById("totalPedido").innerText = "0,00";
          return;
        }

        let total = 0;

        itens.forEach((item, index) => {
          total += item.subtotal;
          tabela.innerHTML += `
<tr>
<td><img class="avatar" src="/produtos/foto/${item.produto.idProduto}" alt="Foto" onerror="this.style.display='none'" /></td>
<td>${item.nomeProduto}</td>
<td>
<div class="qtd-control">
<button type="button" class="btn btn-outline btn-sm" onclick="alterarQuantidade(${index}, -1)">−</button>
<span class="qtd-valor">${item.quantidade}</span>
<button type="button" class="btn btn-outline btn-sm" onclick="alterarQuantidade(${index}, 1)">+</button>
</div>
</td>
<td>R$ ${item.preco.toFixed(2).replace(".", ",")}</td>
<td>R$ ${item.subtotal.toFixed(2).replace(".", ",")}</td>
<td><button type="button" class="btn btn-danger btn-sm" onclick="removerItem(${index})">Remover</button></td>
</tr>
                `;
        });

        document.getElementById("totalPedido").innerText = total
          .toFixed(2)
          .replace(".", ",");
      }

      function salvarPedido() {
        let alunoInput = document.getElementById("aluno").value;

        if (!alunoInput) {
          alert("Selecione um aluno antes de salvar!");
          return;
        }

        if (itens.length === 0) {
          alert("Adicione ao menos um produto ao pedido!");
          return;
        }

        let alunoId = alunoInput.split(" - ")[0];

        let pedido = {
          aluno: { idAluno: alunoId },
          itens: itens,
        };

        fetch("/pedidos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(pedido),
        })
          .then((res) => res.json())
          .then((data) => {
            alert("Pedido salvo com sucesso!");
            location.reload();
          })
          .catch((err) => {
            alert("Erro ao salvar o pedido. Tente novamente.");
            console.error(err);
          });
      }
    </script>
  </body>
</html>
