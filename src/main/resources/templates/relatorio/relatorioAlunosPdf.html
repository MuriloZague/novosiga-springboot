<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"></meta>
    <title>Relatório de Alunos</title>
    <!-- CSS inline: o OpenHTMLtoPDF nao carrega style.css nem suporta variaveis CSS -->
    <style>
        @page {
            size: A4;
            margin: 20mm 15mm;
            @bottom-right {
                content: "Página " counter(page) " de " counter(pages);
                font-size: 9pt;
                color: #64748b;
            }
        }
        body {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 10pt;
            color: #0f172a;
        }
        .header {
            border-bottom: 3px solid #4f46e5;
            padding-bottom: 8px;
            margin-bottom: 16px;
        }
        .brand {
            font-size: 9pt;
            font-weight: bold;
            color: #4f46e5;
            letter-spacing: 1px;
        }
        h1 {
            font-size: 18pt;
            margin: 4px 0 0 0;
        }
        .subtitle {
            color: #64748b;
            margin: 2px 0 0 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background-color: #4f46e5;
            color: #ffffff;
            text-align: left;
            padding: 8px;
            font-size: 9pt;
            text-transform: uppercase;
        }
        td {
            padding: 7px 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        tbody tr:nth-child(even) td {
            background-color: #f8fafc;
        }
        thead {
            display: table-header-group;
        }
        tr {
            page-break-inside: avoid;
        }
        .total {
            margin-top: 12px;
            text-align: right;
            color: #64748b;
            font-size: 9pt;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">NOVO SIGA</div>
        <h1>Relatório de Alunos</h1>
        <p class="subtitle">Alunos cadastrados com CPF e telefone.</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>CPF</th>
                <th>Telefone</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="aluno : ${alunos}">
                <td th:text="${aluno.nomeAluno}"></td>
                <td th:text="${aluno.cpfAluno}"></td>
                <td th:text="${aluno.telefoneAluno}"></td>
            </tr>
        </tbody>
    </table>

    <p class="total" th:text="'Total: ' + ${#lists.size(alunos)} + ' aluno(s)'"></p>
</body>
</html>
