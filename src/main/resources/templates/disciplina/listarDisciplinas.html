<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disciplinas — NOVO SIGA</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header class="navbar">
      <div class="brand"><a href="/novosiga">NOVO SIGA</a></div>
      <nav>
        <a href="/novosiga">Início</a>
        <a href="/alunos/listar">Alunos</a>
        <a href="/cursos/listar">Cursos</a>
        <a href="/disciplinas/listar">Disciplinas</a>
        <a href="/professores/listar">Professores</a>
      </nav>
    </header>

    <main class="container">
      <div class="page-header">
        <div>
          <h1>Disciplinas</h1>
          <p>Disciplinas cadastradas no sistema.</p>
        </div>
        <a class="btn btn-primary" href="/disciplinas/criar"
          >+ Nova Disciplina</a
        >
      </div>

      <form class="toolbar" method="get" th:action="@{/disciplinas/listar}">
        <input
          type="text"
          name="q"
          th:value="${q}"
          placeholder="Buscar por nome ou sigla..."
        />
        <select name="professorId">
          <option value="">Todos os professores</option>
          <option
            th:each="prof : ${professores}"
            th:value="${prof.idProfessor}"
            th:text="${prof.nomeProfessor}"
            th:selected="${professorId != null and professorId == prof.idProfessor}"
          ></option>
        </select>
        <select name="cursoId">
          <option value="">Todos os cursos</option>
          <option
            th:each="curso : ${cursos}"
            th:value="${curso.idCurso}"
            th:text="${curso.nomeCurso}"
            th:selected="${cursoId != null and cursoId == curso.idCurso}"
          ></option>
        </select>
        <button type="submit" class="btn btn-primary">Buscar</button>
        <a class="btn btn-ghost" th:href="@{/disciplinas/listar}">Limpar</a>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>
                <a
                  class="sort-link"
                  th:href="@{/disciplinas/listar(q=${q}, professorId=${professorId}, cursoId=${cursoId}, sort='nomeDisciplina,' + (${param.sort != null and #strings.contains(param.sort, 'nomeDisciplina,asc')} ? 'desc' : 'asc'))}"
                  >Nome</a
                >
              </th>
              <th>
                <a
                  class="sort-link"
                  th:href="@{/disciplinas/listar(q=${q}, professorId=${professorId}, cursoId=${cursoId}, sort='siglaDisciplina,' + (${param.sort != null and #strings.contains(param.sort, 'siglaDisciplina,asc')} ? 'desc' : 'asc'))}"
                  >Sigla</a
                >
              </th>
              <th>Carga Horária</th>
              <th>Professor</th>
              <th>Curso</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="disciplina : ${disciplinas}">
              <td th:text="${disciplina.nomeDisciplina}"></td>
              <td th:text="${disciplina.siglaDisciplina}"></td>
              <td th:text="${disciplina.cargHorariaDisciplina}"></td>
              <td th:text="${disciplina.professor.nomeProfessor}"></td>
              <td th:text="${disciplina.curso.nomeCurso}"></td>
              <td>
                <div class="table-actions">
                  <a
                    class="btn btn-ghost btn-sm"
                    th:href="@{/disciplinas/editar/{id}(id=${disciplina.idDisciplina})}"
                    >Editar</a
                  >
                  <a
                    class="btn btn-danger btn-sm"
                    th:href="@{/disciplinas/excluir/{id}(id=${disciplina.idDisciplina})}"
                    onclick="
                      return confirm(
                        'Deseja realmente excluir esta disciplina?',
                      );
                    "
                    >Excluir</a
                  >
                </div>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(disciplinas)}">
              <td colspan="4" class="empty-state">
                Nenhuma disciplina cadastrada ainda.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
